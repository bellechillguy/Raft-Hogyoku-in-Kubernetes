apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
  namespace: hogyoku
  labels:
    app.kubernetes.io/name: raft
spec:
  serviceName: raft-svc
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: raft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raft
    spec:
      serviceAccountName: raft
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: raft
          image: hogyoku:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: raft-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: rpc
              containerPort: 8000
            - name: health
              containerPort: 8081
          volumeMounts:
            - name: raft-data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
  volumeClaimTemplates:
    - metadata:
        name: raft-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
